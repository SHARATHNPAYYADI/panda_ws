controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController #JointGroupErrorController
    panda_gripper_controller_left:
      type: position_controllers/GripperActionController
    panda_gripper_controller_right:
      type: position_controllers/GripperActionController
panda_arm_controller:
  ros__parameters:
    initial_positions:
      panda_joint1: 0.0
      panda_joint2: 0.0
      panda_joint3: 0.0
      panda_joint4: 0.0
      panda_joint5: 0.0
      panda_joint6: 0.0
      panda_joint7: 0.0
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
      # - panda_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
panda_gripper_controller_right:
  ros__parameters:
    action_monitor_rate: 20.0
    allow_stalling: false
    goal_tolerance: 0.01
    joint: 'panda_finger_joint1'
    max_effort: 5.0
    stall_timeout: 1.0
    stall_velocity_threshold: 0.001
panda_gripper_controller_left:
  ros__parameters:
    action_monitor_rate: 20.0
    allow_stalling: false
    goal_tolerance: 0.01
    joint: 'panda_finger_joint2'
    max_effort: 5.0
    stall_timeout: 1.0
    stall_velocity_threshold: 0.001
